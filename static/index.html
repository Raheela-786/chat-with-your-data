<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat With Your Data</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e;
    --card: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.14);
    --text: #f3f4ff; --muted: #a9acd1;
    --grad: linear-gradient(135deg, #ff6ec4 0%, #7873f5 50%, #4ade80 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text); min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-attachment: fixed;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 60px; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 {
    font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800;
    background: var(--grad); -webkit-background-clip: text;
    background-clip: text; color: transparent;
  }
  header p { color: var(--muted); margin-top: 8px; font-size: 1.05rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px; margin-bottom: 20px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }
  .card h2 { font-size: 1rem; margin-bottom: 14px; color: #c9ccff;
             text-transform: uppercase; letter-spacing: 0.08em; }
  .ask { display: flex; gap: 10px; }
  .ask input {
    flex: 1; padding: 15px 18px; border-radius: 12px; font-size: 1rem;
    border: 1px solid var(--border); background: rgba(0, 0, 0, 0.3);
    color: var(--text); outline: none; transition: border 0.2s, box-shadow 0.2s;
  }
  .ask input:focus { border-color: #7873f5; box-shadow: 0 0 0 3px rgba(120, 115, 245, 0.35); }
  .ask button {
    padding: 0 28px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 1rem; font-weight: 700; color: #fff; background: var(--grad);
    transition: transform 0.15s, opacity 0.2s;
  }
  .ask button:hover { transform: translateY(-2px); }
  .ask button:disabled { opacity: 0.6; cursor: wait; transform: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; font-size: 0.88rem; cursor: pointer;
    border: 1px solid var(--border); background: rgba(255, 255, 255, 0.06);
    color: var(--text); transition: all 0.2s;
  }
  .chip:hover { background: rgba(120, 115, 245, 0.35); border-color: #7873f5; }
  .hidden { display: none; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%; display: inline-block;
    border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: #ff6ec4;
    animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { border-color: rgba(255, 99, 99, 0.5); background: rgba(255, 99, 99, 0.12); }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 0.78rem; font-weight: 700; margin-left: 8px;
  }
  .badge.ok { background: rgba(74, 222, 128, 0.2); color: #4ade80; }
  .badge.retry { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
  pre {
    background: rgba(0, 0, 0, 0.45); padding: 16px; border-radius: 12px;
    overflow-x: auto; font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.9rem; color: #7dd3fc; border: 1px solid var(--border);
    white-space: pre-wrap;
  }
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th {
    background: linear-gradient(90deg, rgba(255, 110, 196, 0.35), rgba(120, 115, 245, 0.35));
    text-align: left; padding: 12px 14px; font-weight: 700;
  }
  td { padding: 11px 14px; border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(255, 255, 255, 0.06); }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chat With Your Data</h1>
    <p>Ask questions in plain English. Get SQL, tables and charts instantly.</p>
  </header>

  <div class="card">
    <div class="ask">
      <input id="q" type="text" placeholder="e.g. Total revenue by city" autocomplete="off" />
      <button id="btn">Ask</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="loading" class="card hidden"><span class="spinner"></span>Thinking and querying the database...</div>
  <div id="error" class="card error hidden"></div>

  <div id="results" class="hidden">
    <div class="card">
      <h2>Generated SQL <span id="attemptBadge" class="badge ok"></span></h2>
      <pre id="sql"></pre>
    </div>
    <div class="card" id="chartCard">
      <h2>Chart</h2>
      <div id="chart"></div>
    </div>
    <div class="card">
      <h2>Data</h2>
      <div class="table-wrap"><table id="table"></table></div>
    </div>
  </div>

  <footer>Read-only queries only &middot; Built with FastAPI, Gemini and Plotly</footer>
</div>

<script>
const examples = [
  "Total revenue by city",
  "Top 3 products by revenue",
  "Sales count by category",
  "How many sales happened in the last 30 days?",
  "Revenue by month",
];

const $ = (id) => document.getElementById(id);
const input = $("q"), btn = $("btn");

examples.forEach((text) => {
  const chip = document.createElement("button");
  chip.className = "chip";
  chip.textContent = text;
  chip.onclick = () => { input.value = text; ask(); };
  $("chips").appendChild(chip);
});

function show(el, visible) { $(el).classList.toggle("hidden", !visible); }

function renderTable(columns, rows) {
  const table = $("table");
  table.innerHTML = "";
  const thead = table.createTHead().insertRow();
  columns.forEach((c) => {
    const th = document.createElement("th");
    th.textContent = c;
    thead.appendChild(th);
  });
  const tbody = table.createTBody();
  rows.forEach((r) => {
    const tr = tbody.insertRow();
    r.forEach((v) => {
      const td = tr.insertCell();
      td.textContent = typeof v === "number" ? v.toLocaleString() : v;
    });
  });
}

function renderChart(chartJson) {
  if (!chartJson) { show("chartCard", false); return; }
  show("chartCard", true);
  const fig = JSON.parse(chartJson);
  const palette = ["#ff6ec4", "#7873f5", "#4ade80", "#fbbf24", "#38bdf8", "#f87171", "#a78bfa", "#34d399"];
  fig.data.forEach((trace) => {
    trace.marker = { color: trace.x.map((_, i) => palette[i % palette.length]) };
  });
  fig.layout = Object.assign(fig.layout || {}, {
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#f3f4ff" },
    xaxis: { title: fig.layout.xaxis.title, gridcolor: "rgba(255,255,255,0.08)" },
    yaxis: { title: fig.layout.yaxis.title, gridcolor: "rgba(255,255,255,0.08)" },
    margin: { t: 50, r: 20, b: 60, l: 70 },
  });
  Plotly.newPlot("chart", fig.data, fig.layout, { responsive: true, displaylogo: false });
}

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  btn.disabled = true;
  show("error", false); show("results", false); show("loading", true);

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error("Server error (" + res.status + ")");
    const data = await res.json();

    if (!data.ok) {
      $("error").textContent = data.message || "Something went wrong.";
      show("error", true);
      return;
    }

    $("sql").textContent = data.sql;
    const tries = data.attempts.length;
    const badge = $("attemptBadge");
    badge.textContent = tries === 1 ? "Worked first try" : "Self-corrected in " + tries + " attempts";
    badge.className = "badge " + (tries === 1 ? "ok" : "retry");

    renderTable(data.columns, data.rows);
    renderChart(data.chart);
    show("results", true);
  } catch (err) {
    $("error").textContent = err.message;
    show("error", true);
  } finally {
    show("loading", false);
    btn.disabled = false;
  }
}

btn.onclick = ask;
input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
</script>
</body>
</html>
